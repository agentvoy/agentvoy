name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run lint

  smoke-test:
    name: Smoke Test CLI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test list command
        run: node packages/cli/dist/index.js list

      - name: Scaffold OpenAI agent
        run: node packages/cli/dist/index.js create test-openai --framework openai --provider openai --model gpt-4o --yes

      - name: Scaffold Google ADK agent
        run: node packages/cli/dist/index.js create test-google --framework google-adk --provider google --model gemini-2.0-flash --yes

      - name: Scaffold CrewAI agent
        run: node packages/cli/dist/index.js create test-crewai --framework crewai --provider openai --model gpt-4o --yes

      - name: Scaffold Anthropic agent
        run: node packages/cli/dist/index.js create test-anthropic --framework anthropic --provider anthropic --model claude-sonnet-4-20250514 --yes

      - name: Scaffold LangGraph agent
        run: node packages/cli/dist/index.js create test-langgraph --framework langgraph --provider openai --model gpt-4o --yes

      - name: Verify scaffolded files exist
        run: |
          for dir in test-openai test-google test-crewai test-anthropic test-langgraph; do
            echo "Checking $dir..."
            ls -la $dir/
            test -f $dir/agent.guard.yml || exit 1
            test -f $dir/requirements.txt || exit 1
            test -f $dir/run.py || exit 1
            echo "$dir OK"
          done
